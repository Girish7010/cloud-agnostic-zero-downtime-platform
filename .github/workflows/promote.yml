# Reusable promotion step. Promotion NEVER rebuilds: it verifies the signature
# of the exact digest produced by the build job, then moves an environment
# pointer (tag) to that digest and records it. In the GitOps model the same
# digest is written to gitops/environments/<env>/ (via PR) and Argo CD pulls it.
name: promote

on:
  workflow_call:
    inputs:
      environment: { required: true, type: string }
      image: { required: true, type: string }
      digest: { required: true, type: string }

permissions:
  contents: read

jobs:
  promote:
    name: ${{ inputs.environment }}
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}   # approval gate when reviewers are configured
    permissions:
      contents: read
      packages: write
    steps:
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Gate — signature must verify for this repository's workflow identity
        env:
          REF: ${{ inputs.image }}@${{ inputs.digest }}
        run: |
          cosign verify "$REF" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            --certificate-identity-regexp "^https://github.com/${GITHUB_REPOSITORY}/\.github/workflows/ci\.yml@refs/heads/main$" \
            > /dev/null
          cosign verify-attestation "$REF" --type cyclonedx \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            --certificate-identity-regexp "^https://github.com/${GITHUB_REPOSITORY}/\.github/workflows/ci\.yml@refs/heads/main$" \
            > /dev/null
          echo "Signature and SBOM attestation verified for $REF"

      - name: Point ${{ inputs.environment }} tag at the same digest (no rebuild)
        env:
          REF: ${{ inputs.image }}@${{ inputs.digest }}
          ENV_TAG: ${{ inputs.image }}:${{ inputs.environment }}
        run: |
          docker buildx imagetools create --tag "$ENV_TAG" "$REF"
          promoted=$(docker buildx imagetools inspect "$ENV_TAG" --format '{{json .Manifest.Digest}}' | tr -d '"')
          echo "built=${{ inputs.digest }} promoted=$promoted"
          test "$promoted" = "${{ inputs.digest }}"
          echo "### ${{ inputs.environment }}: \`${{ inputs.image }}@$promoted\`" >> "$GITHUB_STEP_SUMMARY"
