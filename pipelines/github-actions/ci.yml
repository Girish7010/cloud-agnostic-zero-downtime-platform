name: build-scan-sign
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
  packages: write
  id-token: write
  security-events: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Require application build context
        run: |
          if [ ! -f Dockerfile ]; then
            echo "No root Dockerfile. Add/point to the supplied black-box app build context."
            exit 1
          fi
      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3
      - name: Build once
        run: docker buildx build --load -t assignment-app:${{ github.sha }} .
      - name: Scan image
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: assignment-app:${{ github.sha }}
          format: table
          exit-code: "1"
          severity: CRITICAL,HIGH
      # Registry login, push, digest capture, SBOM and Cosign signing require
      # configured OIDC/cloud identity and should be added after repository setup.
      - name: Record status
        run: echo "Build/scan stage only; push/sign/promotion not configured yet."
