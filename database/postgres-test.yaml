apiVersion: apps/v1
kind: Deployment
metadata:
  name: migration-postgres
  namespace: devops-platform
spec:
  replicas: 1
  selector:
    matchLabels:
      app: migration-postgres
  template:
    metadata:
      labels:
        app: migration-postgres
    spec:
      containers:
        - name: postgres
          image: postgres:16-alpine
          imagePullPolicy: IfNotPresent
          args:
            - postgres
            - -c
            - shared_buffers=32MB
            - -c
            - max_connections=20
          ports:
            - name: postgres
              containerPort: 5432
          env:
            - name: POSTGRES_DB
              value: migration_demo
            - name: POSTGRES_USER
              value: migration_user
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: migration-db-secret
                  key: POSTGRES_PASSWORD
          readinessProbe:
            exec:
              command:
                - sh
                - -c
                - pg_isready -U migration_user -d migration_demo
            initialDelaySeconds: 10
            periodSeconds: 5
          livenessProbe:
            exec:
              command:
                - sh
                - -c
                - pg_isready -U migration_user -d migration_demo
            initialDelaySeconds: 20
            periodSeconds: 10
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 250m
              memory: 256Mi
          volumeMounts:
            - name: postgres-data
              mountPath: /var/lib/postgresql/data
      volumes:
        - name: postgres-data
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: migration-postgres
  namespace: devops-platform
spec:
  selector:
    app: migration-postgres
  ports:
    - name: postgres
      port: 5432
      targetPort: 5432
  type: ClusterIP
