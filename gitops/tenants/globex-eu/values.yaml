# Dedicated EU tenant (ring 2). Adding a directory like this one is the single
# reviewed change that onboards a tenant (scripts/onboard-tenant.sh locally,
# Argo CD ApplicationSet in the cloud design).
platform:
  namespace: tenant-globex-eu
  release: tenant-globex-eu
  ring: 2
tenant:
  id: globex-eu
  mode: dedicated
  residency: eu
  region: eu-central-1
api:
  replicas: 1
  autoscaling:
    enabled: true
    minReplicas: 1
    maxReplicas: 2
  resources:
    requests: { cpu: 50m, memory: 96Mi }
    limits: { cpu: 300m, memory: 256Mi }
worker:
  resources:
    requests: { cpu: 50m, memory: 96Mi }
    limits: { cpu: 300m, memory: 256Mi }
