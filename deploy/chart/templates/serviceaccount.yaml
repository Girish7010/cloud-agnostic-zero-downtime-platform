apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Release.Name }}-app
  labels:
    {{- include "platform-app.labels" . | nindent 4 }}
  {{- with .Values.serviceAccount.annotations }}
  annotations:
    # e.g. IRSA / workload identity binding to this tenant's secrets only.
    {{- toYaml . | nindent 4 }}
  {{- end }}
automountServiceAccountToken: false
